<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ethylene Gas Monitoring Dashboard</title>
  <!-- Chart.js for graphs -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- FontAwesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; direction: ltr; }
    
    .container { max-width: 1200px; margin: 0 auto; }
    
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    header h1 { font-size: 1.5rem; color: var(--text-main); display: flex; align-items: center; gap: 10px; }
    
    /* Notification Banner */
    .alert-banner {
      display: none;
      background-color: var(--danger);
      color: white;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-weight: bold;
      align-items: center;
      gap: 12px;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }

    /* Cards Grid */
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 24px; }
    .card { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
    .card-title { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 8px; }
    .card-value { font-size: 2rem; font-weight: bold; display: flex; align-items: baseline; gap: 8px; }
    .unit { font-size: 1rem; color: var(--text-muted); }

    /* Status Indicator */
    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .status-normal { background: rgba(16, 185, 129, 0.2); color: var(--primary); }
    .status-danger { background: rgba(239, 68, 68, 0.2); color: var(--danger); }

    /* Controls & Chart Layout */
    .main-content { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
    @media (max-width: 768px) { .main-content { grid-template-columns: 1fr; } }

    .chart-container { position: relative; height: 350px; width: 100%; }

    .controls { display: flex; flex-direction: column; gap: 16px; }
    .btn {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-danger { background-color: var(--danger); color: white; }
    .btn-danger:hover { opacity: 0.9; }
    .btn-secondary { background-color: var(--border); color: var(--text-main); }
    .btn-secondary:hover { background-color: #475569; }

    .control-group { display: flex; flex-direction: column; gap: 8px; }
    .control-group label { font-size: 0.9rem; color: var(--text-muted); }
    input[type="range"] { width: 100%; }

    /* Log List */
    .log-list { list-style: none; max-height: 200px; overflow-y: auto; font-size: 0.85rem; color: var(--text-muted); }
    .log-item { padding: 6px 0; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1><i class="fa-solid fa-flask"></i> Ethylene Gas Monitoring System</h1>
      <span id="systemStatus" class="status-badge status-normal">System Normal</span>
    </header>

    <!-- Alert Banner -->
    <div id="alertBanner" class="alert-banner">
      <i class="fa-solid fa-triangle-exclamation fa-lg"></i>
      <span id="alertMessage">WARNING: Ethylene levels exceeded threshold!</span>
    </div>

    <!-- Live Cards -->
    <div class="grid">
      <div class="card">
        <div class="card-title">Live Sensor Reading</div>
        <div class="card-value"><span id="currentValue">1.20</span> <span class="unit">PPM</span></div>
      </div>
      <div class="card">
        <div class="card-title">Alert Threshold</div>
        <div class="card-value"><span id="thresholdValue">5.00</span> <span class="unit">PPM</span></div>
      </div>
      <div class="card">
        <div class="card-title">Peak Value Recorded</div>
        <div class="card-value"><span id="maxValue">1.20</span> <span class="unit">PPM</span></div>
      </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <!-- Real-time Chart -->
      <div class="card">
        <div class="card-title">Real-Time Ethylene Level Chart</div>
        <div class="chart-container">
          <canvas id="ethyleneChart"></canvas>
        </div>
      </div>

      <!-- Controls & Simulator Panel -->
      <div class="card controls">
        <div class="card-title">Control & Simulation Panel</div>
        
        <button class="btn btn-danger" onclick="triggerLeak()">
          <i class="fa-solid fa-radiation"></i> Simulate Gas Leak
        </button>
        
        <button class="btn btn-secondary" onclick="resetSystem()">
          <i class="fa-solid fa-rotate-left"></i> Reset System
        </button>

        <div class="control-group">
          <label for="thresholdRange">Adjust Threshold: <b id="rangeVal">5.0</b> PPM</label>
          <input type="range" id="thresholdRange" min="2" max="10" step="0.5" value="5" oninput="updateThreshold(this.value)">
        </div>

        <div class="card-title" style="margin-top: 10px;">Alert Log</div>
        <ul id="logList" class="log-list"></ul>
      </div>
    </div>
  </div>

  <script>
    // System Variables
    let threshold = 5.0;
    let isLeakSimulated = false;
    let maxEthylene = 1.2;
    const maxDataPoints = 15;

    // Chart.js Setup
    const ctx = document.getElementById('ethyleneChart').getContext('2d');
    const chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: [],
        datasets: [{
          label: 'Ethylene Concentration (PPM)',
          data: [],
          borderColor: '#10b981',
          borderWidth: 2,
          fill: true,
          backgroundColor: 'rgba(16, 185, 129, 0.1)',
          tension: 0.3
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          y: { beginAtZero: true, suggestedMax: 8, grid: { color: '#334155' } },
          x: { grid: { color: '#334155' } }
        },
        plugins: { legend: { labels: { color: '#f8fafc' } } }
      }
    });

    // Data Generator (Simulate Sensor Reading)
    function generateSensorData() {
      if (isLeakSimulated) {
        return Number((Math.random() * (8.5 - 5.5) + 5.5).toFixed(2)); // High values during leak
      } else {
        return Number((Math.random() * (2.2 - 0.8) + 0.8).toFixed(2)); // Normal baseline
      }
    }

    // Update Loop (Every 1.5 Seconds)
    setInterval(() => {
      const now = new Date().toLocaleTimeString('en-US');
      const val = generateSensorData();

      // Track max reading
      if (val > maxEthylene) {
        maxEthylene = val;
        document.getElementById('maxValue').innerText = maxEthylene.toFixed(2);
      }

      // UI Updates
      document.getElementById('currentValue').innerText = val.toFixed(2);

      // Alert Logic
      const alertBanner = document.getElementById('alertBanner');
      const systemStatus = document.getElementById('systemStatus');

      if (val > threshold) {
        alertBanner.style.display = 'flex';
        document.getElementById('alertMessage').innerText = `WARNING: Ethylene level exceeded threshold (${val} PPM)!`;
        systemStatus.innerText = 'DANGER: High Level!';
        systemStatus.className = 'status-badge status-danger';
        chart.data.datasets[0].borderColor = '#ef4444';
        chart.data.datasets[0].backgroundColor = 'rgba(239, 68, 68, 0.2)';
        
        addLogItem(now, val);
      } else {
        alertBanner.style.display = 'none';
        systemStatus.innerText = 'System Normal';
        systemStatus.className = 'status-badge status-normal';
        chart.data.datasets[0].borderColor = '#10b981';
        chart.data.datasets[0].backgroundColor = 'rgba(16, 185, 129, 0.1)';
      }

      // Chart Update
      if (chart.data.labels.length >= maxDataPoints) {
        chart.data.labels.shift();
        chart.data.datasets[0].data.shift();
      }
      chart.data.labels.push(now);
      chart.data.datasets[0].data.push(val);
      chart.update();

    }, 1500);

    // Simulator Actions
    function triggerLeak() {
      isLeakSimulated = true;
    }

    function resetSystem() {
      isLeakSimulated = false;
      maxEthylene = 1.2;
      document.getElementById('maxValue').innerText = maxEthylene.toFixed(2);
      document.getElementById('alertBanner').style.display = 'none';
    }

    function updateThreshold(val) {
      threshold = parseFloat(val);
      document.getElementById('thresholdValue').innerText = threshold.toFixed(2);
      document.getElementById('rangeVal').innerText = threshold.toFixed(1);
    }

    function addLogItem(time, val) {
      const logList = document.getElementById('logList');
      // Avoid spamming duplicate logs
      if (logList.firstChild && logList.firstChild.dataset.time === time) return;

      const li = document.createElement('li');
      li.className = 'log-item';
      li.dataset.time = time;
      li.innerHTML = `<span>ALERT: ${val} PPM</span> <span>${time}</span>`;
      logList.insertBefore(li, logList.firstChild);
    }
  </script>
</body>
</html>
